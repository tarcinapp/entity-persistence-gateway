# HIERARCHICAL TIMEOUT CONFIGURATION
#
# This configuration follows a hierarchical structure to ensure flexibility and ease of management.
#
# Hierarchy Levels:
# 1. Global Defaults: app.timeouts.default
#    - Base values for the entire application.
#
# 2. Controller Defaults: app.timeouts.<controller>.default
#    - Inherits from Global Defaults.
#    - Can be overridden to set specific baselines for a controller (e.g., entities, lists).
#
# 3. Kind Defaults (Optional): app.timeouts.entities.kinds.<kindName>.default
#    - Specific defaults for a business domain object (e.g., 'book').
#    - Useful when specific kinds require different performance characteristics.
#
# 4. Route Definitions: app.timeouts.<controller>.<routeId>
#    - The most specific level.
#    - Inherits from the relevant default (Kind Default if applicable, otherwise Controller Default).
#    - Users can override these specific values to fine-tune a single operation.
#
# Usage:
# - Connect Timeout: Time to establish a TCP connection with the backend.
# - Response Timeout: Time to wait for the backend to send a response after the connection is established.

app:
  timeouts:
    # LEVEL 1: GLOBAL DEFAULTS
    default:
      connectTimeoutMs: 3000     # 3 Seconds
      responseTimeoutMs: 30000   # 30 Seconds

    # LEVEL 2: CONTROLLER DEFAULTS & ROUTES
