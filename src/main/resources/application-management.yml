management:
  endpoints:
    web:
      exposure:
        # STABILITY FIX: Direct reference to the string variable.
        # No more nested logic or map lookups that cause startup crashes.
        include: "${app.inbound.exposedEndpoints}"
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    
    # Conditional enabling based on the main flag
    gateway:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    shutdown:
      enabled: false
    env:
      enabled: true
    configprops:
      enabled: false

  metrics:
    tags:
      application: ${app.name}
      environment: ${spring.profiles.active:default}
    
    distribution:
      percentiles-histogram:
        http.server.requests: true
    
    export:
      prometheus:
        enabled: true
        step: 1m

  health:
    defaults:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10MB
  
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full