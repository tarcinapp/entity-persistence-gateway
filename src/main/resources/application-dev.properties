# default field set configuration
#app.fieldsets.entities.defaultFieldset=hide-managed-all

# sample configuration of saved queries
# clients can query ?q=by-book-name&book-name={whatever}
app.queries.by-book-name='filter[where][_name]=' + #query['book-name']

# What are we going to do with query parameters like filter[foo].
# This notation is specific to the backend. We can either
# - use them as they are: false
# - prevent them reach backend.
app.allowBackendQueryNotation=true

# Route tag toggling (optional - comment out both to include all routes)
# Use tagsOn for whitelist mode: only include routes with specified tags
# Use tagsOff for blacklist mode: exclude routes with specified tags
#app.toggles.tags.on[0]=entities

# Generic through endpoints are now explicitly generated; no longer need includeGenericEndpoints
app.toggles.tags.on[0]=generic

# =============================================================================
# THROUGH KIND ALIAS TESTING
# Backend allowed kinds:
#   entity: book, author, chapter
#   list: bookshelf, library
#   entityReaction: like, comment, rating, upvote, flag
#   listReaction: like, comment, rating, upvote, flag
#   listEntityRel: contains
#
# Entity "books" (kind=book) with:
#   through.reactions "likes" (kind=like) — entityReaction
#   through.lists "bookshelves" (kind=bookshelf) — list
# List "bookshelves" (kind=bookshelf) with:
#   through.reactions "ratings" (kind=rating) — listReaction
#   through.entities "authors" (kind=author) — entity
# =============================================================================
app.oas.controllers.entities.aliases[0].alias=books
app.oas.controllers.entities.aliases[0].kind=book
app.oas.controllers.entities.aliases[0].through.reactions[0].alias=likes
app.oas.controllers.entities.aliases[0].through.reactions[0].kind=like
app.oas.controllers.entities.aliases[0].through.reactions[1].alias=comments
app.oas.controllers.entities.aliases[0].through.reactions[1].kind=comment
app.oas.controllers.entities.aliases[0].through.reactions[1].schema={"type":"object","properties":{"text":{"type":"string"}},"required":["text"]}
app.oas.controllers.entities.aliases[0].through.lists[0].alias=bookshelves
app.oas.controllers.entities.aliases[0].through.lists[0].kind=bookshelf

app.oas.controllers.lists.aliases[0].alias=bookshelves
app.oas.controllers.lists.aliases[0].kind=bookshelf
app.oas.controllers.lists.aliases[0].through.reactions[0].alias=ratings
app.oas.controllers.lists.aliases[0].through.reactions[0].kind=rating
app.oas.controllers.lists.aliases[0].through.reactions[1].alias=comments
app.oas.controllers.lists.aliases[0].through.reactions[1].kind=comment
app.oas.controllers.lists.aliases[0].through.reactions[1].schema={"type":"object","properties":{"_listId":{"type":"string"},"text":{"type":"string"}},"required":["_listId","text"]}
app.oas.controllers.lists.aliases[0].through.entities[0].alias=authors
app.oas.controllers.lists.aliases[0].through.entities[0].kind=author
app.oas.controllers.lists.aliases[0].through.entities[1].alias=books
app.oas.controllers.lists.aliases[0].through.entities[1].kind=book