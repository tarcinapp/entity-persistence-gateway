# application name
app.name=books

# application shortcode to use in request ids, role prefixes, etc.
app.shortcode=tarcinapp

# error response configuration
app.error.include-message=always
app.error.include-stacktrace=always

# logging configuration
app.debug=false
app.logging.tarcinapp=DEBUG
app.logging.gateway=INFO
app.logging.http=DEBUG
app.logging.redisson=INFO

# authentication provider configuration
app.auth.providers[0].issuer=tarcinapp-idm
app.auth.providers[0].public-

# routing target configuration - default backend service
app.outbound.routing-target.protocol=http
app.outbound.routing-target.host=localhost
app.outbound.routing-target.port=3000
app.outbound.routing-target.baseUri=/

# policy evaluation point (opa) configuration
app.outbound.opa.protocol=http
app.outbound.opa.host=localhost
app.outbound.opa.port=8181

# redis configuration for rate limit, policy result caching and distributed locking
app.outbound.redis.host=localhost
app.outbound.redis.port=6379
app.outbound.redis.database=0
app.outbound.redis.password=devpassword123

# caching control
app.local-cache.default.size=10MB
app.local-cache.default.timeToLive=30m

# request size overrides for development
app.request-sizes.default.create=5KB
app.request-sizes.default.update=5KB

# kind alias configuration

# =============================================================================
# ENTITIES: books -> chapters (children), authors (parents)
# =============================================================================
app.oas.controllers.entities.aliases[0].alias=books
app.oas.controllers.entities.aliases[0].kind=book
app.oas.controllers.entities.aliases[0].validationEnabled=true
app.oas.controllers.entities.aliases[0].schema={"type":"object","properties":{"_name":{"type":"string"},"isbn":{"type":"string"}},"required":["_name","isbn"]}
app.oas.controllers.entities.aliases[0].children[0].alias=chapters
app.oas.controllers.entities.aliases[0].children[0].kind=chapter
app.oas.controllers.entities.aliases[0].children[0].validationEnabled=true
app.oas.controllers.entities.aliases[0].children[0].schema={"type":"object","properties":{"_name":{"type":"string"},"pageCount":{"type":"integer"}},"required":["_name","pageCount"]}
app.oas.controllers.entities.aliases[0].parents[0].alias=authors
app.oas.controllers.entities.aliases[0].parents[0].kind=author
app.oas.controllers.entities.aliases[0].parents[0].validationEnabled=true
app.oas.controllers.entities.aliases[0].parents[0].schema={"type":"object","properties":{"_name":{"type":"string"},"bio":{"type":"string"}},"required":["_name","bio"]}

app.oas.controllers.entities.aliases[1].alias=authors
app.oas.controllers.entities.aliases[1].kind=author
app.oas.controllers.entities.aliases[1].validationEnabled=true
app.oas.controllers.entities.aliases[1].schema={"type":"object","properties":{"_name":{"type":"string"},"country":{"type":"string"}},"required":["_name"]}
app.oas.controllers.entities.aliases[1].children[0].alias=books
app.oas.controllers.entities.aliases[1].children[0].kind=book
app.oas.controllers.entities.aliases[1].children[0].validationEnabled=true
app.oas.controllers.entities.aliases[1].children[0].schema={"type":"object","properties":{"_name":{"type":"string"},"isbn":{"type":"string"}},"required":["_name"]}

# =============================================================================
# LISTS: bookshelves -> sections (children), libraries (parents)
# =============================================================================
app.oas.controllers.lists.aliases[0].alias=bookshelves
app.oas.controllers.lists.aliases[0].kind=bookshelf
app.oas.controllers.lists.aliases[0].validationEnabled=true
app.oas.controllers.lists.aliases[0].schema={"type":"object","properties":{"_name":{"type":"string"},"capacity":{"type":"integer"}},"required":["_name"]}
app.oas.controllers.lists.aliases[0].children[0].alias=sections
app.oas.controllers.lists.aliases[0].children[0].kind=section
app.oas.controllers.lists.aliases[0].children[0].validationEnabled=true
app.oas.controllers.lists.aliases[0].children[0].schema={"type":"object","properties":{"_name":{"type":"string"},"genre":{"type":"string"}},"required":["_name","genre"]}
app.oas.controllers.lists.aliases[0].parents[0].alias=libraries
app.oas.controllers.lists.aliases[0].parents[0].kind=library
app.oas.controllers.lists.aliases[0].parents[0].validationEnabled=true
app.oas.controllers.lists.aliases[0].parents[0].schema={"type":"object","properties":{"_name":{"type":"string"},"city":{"type":"string"}},"required":["_name","city"]}

app.oas.controllers.lists.aliases[1].alias=libraries
app.oas.controllers.lists.aliases[1].kind=library
app.oas.controllers.lists.aliases[1].validationEnabled=true
app.oas.controllers.lists.aliases[1].schema={"type":"object","properties":{"_name":{"type":"string"},"city":{"type":"string"}},"required":["_name","city"]}
app.oas.controllers.lists.aliases[1].children[0].alias=bookshelves
app.oas.controllers.lists.aliases[1].children[0].kind=bookshelf
app.oas.controllers.lists.aliases[1].children[0].validationEnabled=true
app.oas.controllers.lists.aliases[1].children[0].schema={"type":"object","properties":{"_name":{"type":"string"}},"required":["_name"]}

# =============================================================================
# RELATIONS: contains
# =============================================================================
app.oas.controllers.relations.aliases[0].alias=contains
app.oas.controllers.relations.aliases[0].kind=contains
app.oas.controllers.relations.aliases[0].validationEnabled=true
app.oas.controllers.relations.aliases[0].schema={"type":"object","properties":{"note":{"type":"string"},"order":{"type":"integer"}},"required":["order"]}

# =============================================================================
# ENTITY REACTIONS: comments -> replies (children), likes
# =============================================================================
app.oas.controllers.entityReactions.aliases[0].alias=comments
app.oas.controllers.entityReactions.aliases[0].kind=comment
app.oas.controllers.entityReactions.aliases[0].validationEnabled=true
app.oas.controllers.entityReactions.aliases[0].schema={"type":"object","properties":{"_entityId":{"type":"string"},"text":{"type":"string"}},"required":["_entityId","text"]}
app.oas.controllers.entityReactions.aliases[0].children[0].alias=replies
app.oas.controllers.entityReactions.aliases[0].children[0].kind=reply
app.oas.controllers.entityReactions.aliases[0].children[0].validationEnabled=true
app.oas.controllers.entityReactions.aliases[0].children[0].schema={"type":"object","properties":{"_entityId":{"type":"string"},"text":{"type":"string"},"replyTo":{"type":"string"}},"required":["_entityId","text","replyTo"]}

app.oas.controllers.entityReactions.aliases[1].alias=likes
app.oas.controllers.entityReactions.aliases[1].kind=like
app.oas.controllers.entityReactions.aliases[1].validationEnabled=true
app.oas.controllers.entityReactions.aliases[1].schema={"type":"object","properties":{"_entityId":{"type":"string"}},"required":["_entityId"]}

# =============================================================================
# LIST REACTIONS: ratings -> responses (children), upvotes
# =============================================================================
app.oas.controllers.listReactions.aliases[0].alias=ratings
app.oas.controllers.listReactions.aliases[0].kind=rating
app.oas.controllers.listReactions.aliases[0].validationEnabled=true
app.oas.controllers.listReactions.aliases[0].schema={"type":"object","properties":{"_listId":{"type":"string"},"score":{"type":"integer"}},"required":["_listId","score"]}
app.oas.controllers.listReactions.aliases[0].children[0].alias=responses
app.oas.controllers.listReactions.aliases[0].children[0].kind=response
app.oas.controllers.listReactions.aliases[0].children[0].validationEnabled=true
app.oas.controllers.listReactions.aliases[0].children[0].schema={"type":"object","properties":{"_listId":{"type":"string"},"message":{"type":"string"}},"required":["_listId","message"]}

app.oas.controllers.listReactions.aliases[1].alias=upvotes
app.oas.controllers.listReactions.aliases[1].kind=upvote
app.oas.controllers.listReactions.aliases[1].validationEnabled=true
app.oas.controllers.listReactions.aliases[1].schema={"type":"object","properties":{"_listId":{"type":"string"}},"required":["_listId"]}

# default field set configuration
#app.fieldsets.entities.defaultFieldset=hide-managed-all

# sample configuration of saved queries
# clients can query ?q=by-book-name&book-name={whatever}
app.queries.by-book-name='filter[where][_name]=' + #query['book-name']

# What are we going to do with query parameters like filter[foo].
# This notation is specific to the backend. We can either
# - use them as they are: false
# - prevent them reach backend.
app.allowBackendQueryNotation=true

