# application name
app.name=books

# application shortcode to use in request ids
app.shortcode=tarcinapp

# error response configuration
app.error.include-message=always
app.error.include-stacktrace=always

# logging configuration
app.debug=false
app.logging.tarcinapp=DEBUG
app.logging.gateway=INFO
app.logging.http=DEBUG
app.logging.redisson=INFO

# authentication provider configuration
app.auth.providers[0].issuer=tarcinapp-idm
app.auth.providers[0].public-

# routing target configuration - default backend service
app.outbound.routing-target.protocol=http
app.outbound.routing-target.host=localhost
app.outbound.routing-target.port=3000
app.outbound.routing-target.baseUri=/

# policy evaluation point (opa) configuration
app.outbound.opa.protocol=http
app.outbound.opa.host=localhost
app.outbound.opa.port=8181

# redis configuration for rate limit, policy result caching and distributed locking
app.outbound.redis.host=localhost
app.outbound.redis.port=6379
app.outbound.redis.database=0
app.outbound.redis.password=devpassword123

# caching control
app.local-cache.default.size=10MB
app.local-cache.default.timeToLive=30m

# request size overrides for development
app.request-sizes.default.create=5KB
app.request-sizes.default.update=5KB
app.request-sizes.entities.create=5KB
app.request-sizes.lists.create=5KB
app.request-sizes.reactions.create=1KB

# kind alias configuration (new OAS structure)
# Maps /entities/books to entity kind "book" with JSON schema validation
app.oas.controllers.entities.aliases[0].alias=books
app.oas.controllers.entities.aliases[0].kind=book
app.oas.controllers.entities.aliases[0].validationEnabled=true
app.oas.controllers.entities.aliases[0].schema={"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","properties":{"_name":{"type":"string"},"author":{"type":"string"},"details":{"type":"object","properties":{"publishedDate":{"type":"string","format":"date"},"genre":{"type":"string"}},"required":["publishedDate","genre"]}},"required":["_name","author","details"],"additionalProperties":false}

# Override request sizes specifically for 'book' kind
app.request-sizes.entities.kinds.book.create=1KB
app.request-sizes.entities.kinds.book.update=1KB

# Override rate limits for all routes of 'book' kind
app.rate-limits.entities.kinds.book.default.replenishRate=10
app.rate-limits.entities.kinds.book.default.burstCapacity=20

app.local-cache.entities.kinds.book.default.size=5MB
app.local-cache.entities.kinds.book.default.timeToLive=15m

# Maps /lists/bookshelves to list kind "bookshelf" with JSON schema validation
app.oas.controllers.lists.aliases[0].alias=bookshelves
app.oas.controllers.lists.aliases[0].kind=bookshelf
app.oas.controllers.lists.aliases[0].validationEnabled=true
app.oas.controllers.lists.aliases[0].schema={"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","properties":{"_name":{"type":"string","description":"Name of the bookshelf"},"description":{"type":"string","description":"Description of the bookshelf"},"genre":{"type":"string","description":"Primary genre of books in this bookshelf"},"capacity":{"type":"integer","description":"Maximum number of books this shelf can hold"}},"required":["_name","genre"],"additionalProperties":false}

# Override request sizes for 'bookshelf' kind
app.request-sizes.lists.kinds.bookshelf.create=2KB
app.request-sizes.lists.kinds.bookshelf.update=2KB

# Override rate limits for all routes of 'bookshelf' kind
app.rate-limits.lists.kinds.bookshelf.default.replenishRate=15
app.rate-limits.lists.kinds.bookshelf.default.burstCapacity=30

# Caching configuration for 'bookshelf' kind
app.local-cache.lists.kinds.bookshelf.default.size=8MB
app.local-cache.lists.kinds.bookshelf.default.timeToLive=20m

# default field set configuration
#app.fieldsets.entities.defaultFieldset=hide-managed-all

# sample configuration of saved queries
# clients can query ?q=by-book-name&book-name={whatever}
app.queries.by-book-name='filter[where][_name]=' + #query['book-name']

# What are we going to do with query parameters like filter[foo].
# This notation is specific to the backend. We can either
# - use them as they are: false
# - prevent them reach backend.
app.allowBackendQueryNotation=true

# disabled routes
app.toggles.tags.off[0]=generic