# ====================================================================
# OpenAPI Configuration for Entity Persistence Gateway
# ====================================================================
#
# This file configures OpenAPI documentation for the dynamic API gateway.
# It maps controller routes to user-friendly aliases with schemas and
# validation rules.
#
# STRUCTURE OVERVIEW:
# -------------------
# - API Identification: Global API metadata (title, version, contact, servers)
# - Controllers: Configuration for each controller type
# - Tags: Global tags for grouping API operations
#
# AVAILABLE CONTROLLERS:
# ----------------------
# - entities:         Main entity controller for CRUD operations
# - lists:            List/collection management controller
# - relations:        Entity relationship management
# - entity-reactions: Reactions on entities (likes, comments, etc.)
# - list-reactions:   Reactions on lists
#
# CONFIGURATION CONCEPTS:
# -----------------------
# - alias:            User-friendly URL path (e.g., "books" instead of "entities")
# - kind:             Internal entity type identifier
# - schema:           JSON Schema for request/response validation
# - validationEnabled: Toggle validation on/off (alias-level or route-level)
# - routes:           Per-route configuration (must match route IDs in application-routes.yml)
# - children:         Nested resource configuration for hierarchical data
#
# ROUTE CONFIGURATION:
# --------------------
# Route keys under aliases.routes MUST match the route IDs defined in
# application-routes.yml for the corresponding controller. For example:
#   entities controller: createEntity, findEntities, findEntityById, etc.
#   lists controller: createList, findLists, findListById, etc.
#
# VALIDATION & SCHEMA INHERITANCE:
# ---------------------------------
# - Alias-level schema/validation applies to all routes by default
# - Route-level schema/validation overrides alias-level settings
# - Useful for different validation rules per operation (strict create, lenient update)
#
# ====================================================================

app:
  oas:
    # ----------------------------------------------------------------
    # 1. API IDENTIFICATION (GLOBAL)
    # ----------------------------------------------------------------
    title: "Entity Persistence Platform API"
    version: "1.0.0"
    description: |
      This API acts as a central Gateway entry point providing dynamic entity 
      management, security, validation, and orchestration services.
    
    contact:
      name: "Platform Team"
      email: "support@tarcinapp.com"
      url: "https://tarcinapp.com"
    
    servers:
      - url: "https://api.tarcinapp.com/v1"
        description: "Production Environment"
      - url: "http://localhost:8081/api/v1"
        description: "Local Development"

    # ----------------------------------------------------------------
    # 2. CONTROLLER DEFINITIONS (REFERENCE)
    # ----------------------------------------------------------------
    # Kind alias configurations are defined in application-dev.properties
    # and other environment-specific property files.
    #
    # This structure shows the available controllers. Controllers can be
    # extended with alias configurations through property files without
    # requiring code changes.
    #
    # Example structure (configured via properties):
    #   controllers:
    #     entities:
    #       aliases:
    #         - alias: books
    #           kind: book
    #           schema: { ... }
    #           validationEnabled: true
    #     lists:
    #       aliases:
    #         - alias: bookshelves
    #           kind: bookshelf
    #           schema: { ... }
    #           validationEnabled: true
    #
    controllers: {}
    
    # Example with full structure (commented out):
    # Note: Route keys must match the route IDs defined in application-routes.yml
    # Note: Schema and validationEnabled can be overridden at route level
