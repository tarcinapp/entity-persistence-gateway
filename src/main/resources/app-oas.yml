# ====================================================================
# OpenAPI Configuration for Entity Persistence Gateway
# ====================================================================
#
# This file configures OpenAPI documentation for the dynamic API gateway.
# It maps controller routes to user-friendly aliases with schemas and
# validation rules.
#
# STRUCTURE OVERVIEW:
# -------------------
# - API Identification: Global API metadata (title, version, contact, servers)
# - Controllers: Configuration for each controller type
# - Tags: Global tags for grouping API operations
#
# AVAILABLE CONTROLLERS (controllerName):
# ---------------------------------------
# - entities:              Main entity controller for CRUD operations
# - lists:                 List/collection management controller
# - entitiesThroughList:   Entities addressed through list context
# - listsThroughEntity:    Lists addressed through entity context
# - relations:             Entity relationship management
# - entityReactions:       Reactions on entities (likes, comments, etc.)
# - reactionsThroughEntity: Reactions addressed through entity context
# - listReactions:         Reactions on lists
# - reactionsThroughList:  Reactions addressed through list context
#
# CONFIGURATION CONCEPTS:
# -----------------------
# - controllerName:   Matches route metadata controllerName (may differ from recordType)
# - alias:            User-friendly URL path (e.g., "books" instead of "entities")
# - kind:             Internal entity type identifier
# - singular:         Optional explicit singular form used for operationId generation.
#                     Auto-derived by heuristic (strip trailing 's') if omitted.
#                     Set explicitly for irregular plurals (e.g. "heroes" → singular: "hero").
# - description:      Human-readable description surfaced in generated OpenAPI docs
# - schema:           JSON Schema for request/response validation (JSON string)
# - validationEnabled: Toggle validation on/off (alias-level or route-level).
#                     Defaults to true when a schema is provided.
# - routes:           Per-route configuration (must match route IDs in application-routes.yml)
# - children:         Nested resource configuration for hierarchical parent→child traversal
# - parents:          Nested resource configuration for hierarchical child→parent traversal
# - through:          Cross-controller access patterns. Exposes associated records of a
#                     different type through the parent alias record. See THROUGH CONFIG below.
#
# ROUTE CONFIGURATION:
# --------------------
# Route keys under aliases.routes MUST match the route IDs defined in
# application-routes.yml for the corresponding controller. For example:
#   entities controller: createEntity, findEntities, findEntityById, etc.
#   lists controller: createList, findLists, findListById, etc.
#
# VALIDATION & SCHEMA INHERITANCE:
# ---------------------------------
# Schema lookup priority (highest to lowest):
#   For standard kind-alias routes:
#     1. Route-level schema:     alias.routes.<routeId>.schema
#     2. Alias-level schema:     alias.schema
#   For hierarchy routes (children/parents):
#     1. Hierarchy-route schema: children[].routes.<routeId>.schema
#     2. Hierarchy-level schema: children[].schema
#     3. Alias-level schema:     alias.schema (child kind fallback)
#   For through routes:
#     1. Through-route schema:   through.<type>[].routes.<routeId>.schema
#     2. Through-level schema:   through.<type>[].schema
#     3. Kind-level schema:      through alias kind's own schema
#
# - Alias-level schema/validation applies to all routes by default
# - Route-level schema/validation overrides alias-level settings
# - validationEnabled: false disables schema validation entirely for that scope
# - Useful for different validation rules per operation (strict create, lenient update)
#
# HIERARCHY CONFIG:
# -----------------
# The "children" and "parents" keys under an alias enable hierarchical traversal
# within the same controller. They expose parent→child or child→parent relationships
# as nested REST paths.
#
# Unlike "through", hierarchy stays within the same controller type (entities→entities,
# lists→lists, etc.), but the child/parent can be a different kind.
#
# Supported hierarchy relationships (nested under the alias):
#
#   Parent Controller | key       | URL segment (configurable via app-inbound.yml)
#   ------------------+-----------+------------------------------------------------
#   entities          | children  | entitiesChildrenAccessor (default: children)
#   entities          | parents   | entitiesParentsAccessor  (default: parents)
#   lists             | children  | listsChildrenAccessor    (default: children)
#   lists             | parents   | listsParentsAccessor     (default: parents)
#   entityReactions   | children  | entityReactionsChildrenAccessor (default: children)
#   entityReactions   | parents   | entityReactionsParentsAccessor  (default: parents)
#   listReactions     | children  | listReactionsChildrenAccessor   (default: children)
#   listReactions     | parents   | listReactionsParentsAccessor    (default: parents)
#
# Generated URL patterns:
#   /{entitiesBase}/{kindAlias}/{id}/children/{childAlias}   (children on entities)
#   /{entitiesBase}/{kindAlias}/{id}/parents/{parentAlias}   (parents on entities)
#   /{listsBase}/{kindAlias}/{id}/children/{childAlias}      (children on lists)
#
# ROUTE ID SELECTION FOR HIERARCHY:
# ----------------------------------
# The routeId used as a key in children[].routes or parents[].routes is NOT the same
# as the standard alias routes (e.g. NOT createEntity). It is determined by the
# HTTP method and the accessor type (children/parents), fixed per parent controller:
#
#   Parent controller | Accessor  | HTTP Method | routeId to use
#   ------------------+-----------+-------------+--------------------------------------
#   entities          | children  | POST        | createEntityChild
#   entities          | children  | GET         | findEntityChildren
#   entities          | parents   | GET         | findEntityParents
#   lists             | children  | POST        | createListChild
#   lists             | children  | GET         | findListChildren
#   lists             | parents   | GET         | findListParents
#   entityReactions   | children  | POST        | createChildEntityReaction
#   entityReactions   | children  | GET         | findChildrenEntityReactionsByReactionId
#   entityReactions   | parents   | GET         | findParentsByEntityReactionId
#   listReactions     | children  | POST        | createChildListReaction
#   listReactions     | children  | GET         | findChildrenListReactionsByReactionId
#   listReactions     | parents   | GET         | findParentsByListReactionId
#
# Example: to enforce a stricter schema only when POSTing a chapter under a book:
#   children:
#     - alias: chapters
#       kind: chapter
#       schema: { ... }                     # fallback for all hierarchy operations
#       routes:
#         createEntityChild:                # POST /books/{id}/chapters
#           schema: { ... }                 # overrides the fallback for POST only
#         findEntityChildren:               # GET /books/{id}/chapters
#           validationEnabled: false        # disable validation for GET (no body anyway)
#
# Properties format for hierarchy config:
#   app.oas.controllers.entities.aliases[0].children[0].alias=chapters
#   app.oas.controllers.entities.aliases[0].children[0].kind=chapter
#   app.oas.controllers.entities.aliases[0].children[0].schema={...}
#   app.oas.controllers.entities.aliases[0].children[0].routes.createEntityChild.schema={...}
#   app.oas.controllers.entities.aliases[0].parents[0].alias=series
#   app.oas.controllers.entities.aliases[0].parents[0].kind=series
#
# THROUGH CONFIG:
# ---------------
# The "through" key under an alias enables cross-controller traversal. It exposes
# associated records of a different controller type through the parent record's domain path.
# This is distinct from children/parents which stay within the same controller.
#
# Supported through relationships (nested under the alias):
#
#   Parent Controller | through key | URL segment (configurable via app-inbound.yml)
#   ------------------+-------------+------------------------------------------------
#   entities          | reactions   | reactionsThroughEntity base (default: reactions)
#   entities          | lists       | listsThroughEntity base    (default: lists base)
#   lists             | reactions   | reactionsThroughList base  (default: reactions)
#   lists             | entities    | entitiesThroughList base   (default: entities base)
#
# Generated URL patterns:
#   /{entitiesBase}/{kindAlias}/{id}/reactions/{throughAlias}   (through.reactions on entities)
#   /{entitiesBase}/{kindAlias}/{id}/lists/{throughAlias}       (through.lists on entities)
#   /{listsBase}/{kindAlias}/{id}/reactions/{throughAlias}      (through.reactions on lists)
#   /{listsBase}/{kindAlias}/{id}/{entitiesBase}/{throughAlias} (through.entities on lists)
#
# ROUTE ID SELECTION FOR THROUGH:
# --------------------------------
# The routeId used as a key in through.<type>[].routes is derived from the matched
# gateway route ID by stripping the "ByKindAlias" suffix. Each through relationship
# has a fixed set of available route IDs:
#
#   entities + through.reactions:
#     createReactionByEntityId   (POST)
#     updateReactionsByEntityId  (PATCH)
#     findReactionsByEntityId    (GET)
#     deleteReactionsByEntityId  (DELETE)
#   entities + through.lists:
#     findListsByEntityId        (GET only — no write routes for lists-through-entity)
#   lists + through.reactions:
#     createReactionByListId     (POST)
#     updateReactionsByListId    (PATCH)
#     findReactionsByListId      (GET)
#     deleteReactionsByListId    (DELETE)
#   lists + through.entities:
#     createEntityByListId       (POST)
#     updateEntitiesByListId     (PATCH)
#     findEntitiesByListId       (GET)
#     deleteEntitiesByListId     (DELETE)
#
# Example: stricter schema only when creating a review via through.reactions:
#   through:
#     reactions:
#       - alias: reviews
#         kind: review
#         schema: { ... }                    # fallback for all through operations
#         routes:
#           createReactionByEntityId:        # POST /books/{id}/reactions/reviews
#             schema: { ... }               # overrides fallback for POST only
#
# Properties format for through config:
#   app.oas.controllers.entities.aliases[0].through.reactions[0].alias=reviews
#   app.oas.controllers.entities.aliases[0].through.reactions[0].kind=review
#   app.oas.controllers.entities.aliases[0].through.reactions[0].schema={...}
#   app.oas.controllers.entities.aliases[0].through.reactions[0].routes.createReactionByEntityId.schema={...}
#   app.oas.controllers.entities.aliases[0].through.lists[0].alias=shelves
#   app.oas.controllers.entities.aliases[0].through.lists[0].kind=bookshelf
#   app.oas.controllers.lists.aliases[0].through.entities[0].alias=books
#   app.oas.controllers.lists.aliases[0].through.entities[0].kind=book
#
# ====================================================================

app:
  oas:
    # ----------------------------------------------------------------
    # 1. API IDENTIFICATION (GLOBAL)
    # ----------------------------------------------------------------
    title: "Entity Persistence Platform API"
    version: "1.0.0"
    description: |
      This API acts as a central Gateway entry point providing dynamic entity 
      management, security, validation, and orchestration services.
    
    contact:
      name: "Platform Team"
      email: "support@tarcinapp.com"
      url: "https://tarcinapp.com"
    
    servers:
      - url: "https://api.tarcinapp.com"
        description: "Production Environment"
      - url: "http://localhost:8081"
        description: "Local Development"

    # ----------------------------------------------------------------
    # 2. CONTROLLER DEFINITIONS (REFERENCE)
    # ----------------------------------------------------------------
    # Kind alias configurations are defined in application-dev.properties
    # and other environment-specific property files.
    #
    # This structure shows the available controllers. Controllers can be
    # extended with alias configurations through property files without
    # requiring code changes.
    #
    # Example structure (configured via properties):
    #   controllers:
    #     entities:
    #       aliases:
    #         - alias: books
    #           kind: book
    #           schema: { ... }
    #           validationEnabled: true
    #     lists:
    #       aliases:
    #         - alias: bookshelves
    #           kind: bookshelf
    #           schema: { ... }
    #           validationEnabled: true
    #
    controllers: {}
    
