    #   entities:
    #     aliases:
    #       - alias: books
    #         kind: book
    #         description: "Manage book entities"
    #         schema: |
    #           {
    #             "type": "object",
    #             "properties": {
    #               "title": { "type": "string" },
    #               "author": { "type": "string" },
    #               "isbn": { "type": "string" }
    #             },
    #             "required": ["title", "author"]
    #           }
    #         validationEnabled: true
    #         routes:
    #           createEntity:
    #             operationId: createBook
    #             summary: "Create a new book"
    #             description: "Creates a new book entity with validation"
    #             tags:
    #               - Books
    #             request:
    #               contentType: application/json
    #             # Route-level validation override (optional)
    #             validationEnabled: true
    #           findEntities:
    #             operationId: listBooks
    #             summary: "List all books"
    #             tags:
    #               - Books
    #           findEntityById:
    #             operationId: getBookById
    #             summary: "Get a book by ID"
    #             tags:
    #               - Books
    #           updateEntityById:
    #             operationId: updateBook
    #             summary: "Update a book by ID"
    #             tags:
    #               - Books
    #             # Route-level schema override (optional)
    #             schema: |
    #               {
    #                 "type": "object",
    #                 "properties": {
    #                   "title": { "type": "string" },
    #                   "author": { "type": "string" }
    #                 }
    #               }
    #             validationEnabled: true
    #           replaceEntityById:
    #             operationId: replaceBook
    #             summary: "Replace a book by ID"
    #             tags:
    #               - Books
    #           deleteEntityById:
    #             operationId: deleteBook
    #             summary: "Delete a book by ID"
    #             tags:
    #               - Books
    #             # Disable validation for this specific route
    #             validationEnabled: false
    #       - alias: authors
