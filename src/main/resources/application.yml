        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/lists/updateListById/policy
        - name: AcquireLockForUpdate
        - RemoveRequestHeader=Authorization
      - id: replaceListById
        uri: ${app.backend.protocol}://${app.backend.host}:${app.backend.port}
        predicates:
        - Path=${app.inbound.baseUri}${app.inbound.controllerPaths.lists}/{recordId:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
        - Method=PUT
        filters:
        - name: RequestSize
          args:
            maxSize: ${app.requestSizes.lists.update}
        - name: CheckIfRouteEnabled
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerPaths.lists}, ${app.backend.baseUri}lists
        - name: AuthenticateRequestRefactored
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 10
