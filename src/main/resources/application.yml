        - Method=GET
        filters:
        - name: CheckIfRouteEnabled
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerPaths.lists}, ${app.backend.baseUri}lists
        - name: AuthenticateRequestRefactored
