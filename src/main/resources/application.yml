        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/entities/findEntityChildren/policy
        - name: PreventStringifiedJsonFilter
        - name: ApplyFieldsetConfig
          args:
            recordType: entities
        - name: ConvertSimplerQueriesToBackendFormat
        - name: AddSetsToEntityListOrReactionViaRecordQuery
          args:
            recordType: entities
        - name: PreventQueryByForbiddenFields
          args:
            policyName: /policies/fields/entities/policy
        - RemoveRequestHeader=Authorization
        - name: DropFieldsForMultiItemResponses
