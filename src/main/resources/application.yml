app:
  # set the name of your application
  name: entity-persistence-gateway

  # shortcode is used for prefixes (request id, roles, jmx domain)
  shortcode: "tarcinapp"

  # spring.debug flag
  debug: false

  # Custom request ID header name
  requestId: "X-Request-Id"

  error:
    include-message: never
    include-stacktrace: never
    
---
debug: ${app.debug}

server:
  port: ${app.inbound.port}
  address: ${app.inbound.address}
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful
  server:
    error:
      include-message: ${app.error.include-message}
      include-stacktrace: ${app.error.include-stacktrace}

spring:
  # LINKING: We map Spring's native JMX settings to our custom variables defined in application-jmx.yml
  jmx:
    enabled: ${app.jmx.enabled}
    default-domain: ${app.jmx.default-domain}
    unique-names: ${app.jmx.unique-names}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Configures the shared ObjectMapper bean
  jackson:
    serialization:
      write-dates-as-timestamps: false # Forces ISO-8601 date format (e.g., "2023-12-01T10:00:00Z")

  # Increases the buffer size for request bodies. 
  codec:
    max-in-memory-size: 10MB 

  config:
    import:
      # Authentication and authorization settings
      - classpath:application-auth.yml
      # Inbound HTTP server configuration
      - classpath:app-inbound.yml
      # Outbound service connections and dependencies
      - classpath:app-outbound.yml
      # Request and response timeout configurations
      - classpath:application-timeouts.yml
      # Dynamic route definitions for gateway
      - classpath:application-routes.yml
      # Toggles for enabling/disabling routes
      - classpath:application-route-toggles.yml
      # Logging configuration and levels
      - classpath:application-logging.yml
      # Fieldset definitions for simpler field selection
      - classpath:application-fieldsets.yml
      # Simpler queries configuration
      - classpath:application-queries.yml
      # Request payload size limits
      - classpath:application-request-sizes.yml
      # API rate limiting and throttling rules
      - classpath:application-rate-limits.yml
      # Distributed locking configuration
      - classpath:application-locks.yml
      # Local caching strategies and TTL settings
      - classpath:application-local-caching.yml
      # Actuator and health check endpoints
      - classpath:application-management.yml
      # JMX monitoring and metrics exposure
      - classpath:application-jmx.yml
      # OAS configuration (servers, title, version, contact)
      - classpath:app-oas.yml
      # OpenAPI specification generation settings
      - classpath:application-oas-orchestrator.yml

  application:
    name: ${app.name}
  
  data:
    redis:
      host: ${app.outbound.redis.host}
      port: ${app.outbound.redis.port}
      database: ${app.outbound.redis.database}
      password: ${app.outbound.redis.password}
      
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${app.outbound.routing-target.connectTimeoutMs}
        response-timeout: ${app.outbound.routing-target.responseTimeout}
        pool:
          type: fixed
          max-connections: ${app.outbound.routing-target.pool.maxConnections}
          acquire-timeout: ${app.outbound.routing-target.pool.acquireTimeoutMs}
          max-life-time: 45000 
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${app.inbound.cors.allowedOrigins}
            allowedMethods: ${app.inbound.cors.allowedMethods}
            allowedHeaders: ${app.inbound.cors.allowedHeaders}
            exposedHeaders: ${app.inbound.cors.exposedHeaders}
            allowCredentials: ${app.inbound.cors.allowCredentials}
            maxAge: ${app.inbound.cors.maxAge}
            
      metrics:
        enabled: ${app.inbound.metricsEnabled}
        
      filter:
        local-response-cache:
          enabled: false