        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/entities/replaceEntityById/policy
        - name: AcquireLockForUpdate
        - name: AddForbiddenFieldsFromOriginalToPayloadInReplace
          args:
            policyName: /policies/fields/entities/policy
        - name: AddManagedFieldsFromOriginalToPayloadInReplace
        - RemoveRequestHeader=Authorization
      - id: deleteEntityById
        uri: ${app.backend.protocol}://${app.backend.host}:${app.backend.port}
        predicates:
        - Path=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}/{recordId:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
        - Method=DELETE
        filters:
        - name: CheckIfRouteEnabled
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}, ${app.backend.baseUri}entities
        - name: AuthenticateRequestRefactored
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 10
              burstCapacity: 20
        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/entities/deleteEntityById/policy
        - RemoveRequestHeader=Authorization
      - id: findEntityChildren
        uri: ${app.backend.protocol}://${app.backend.host}:${app.backend.port}
        predicates:
        - Path=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}/{recordId}/children
        - Method=GET
        filters:
        - name: CheckIfRouteEnabled
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}/(?<recordId>.*)/children, ${app.backend.baseUri}entities/${recordId}/children
        - name: AuthenticateRequestRefactored
        - name: RequestRateLimiter
          args:
