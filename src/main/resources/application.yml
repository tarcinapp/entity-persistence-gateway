app:

  # set the name of your application (e.g. books, recipes, movies, etc..)
  name: entity-persistence-gateway

  # shortcode is going to be used for:
  # - prefix for generated request id for each request
  # - prefix for the role names (e.g. tarcinapp.member)
  # - jmx domain name, if jmx is enabled
  shortcode: "tarcinapp"

  # spring.debug flag
  debug: false

  # enable/disable jmx monitoring
  jmx: false

  # Custom request ID header name used in logging and tracing
  requestId: "X-Request-Id"
    
  commonBaseSchema: '{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","properties":{"_kind":{"type":"string"},"_slug":{"type":"string"},"_createdDateTime":{"type":"string","format":"date-time"},"_lastUpdatedDateTime":{"type":"string","format":"date-time"},"_validFromDateTime":{"type":"string","format":"date-time","nullable":true},"_validUntilDateTime":{"type":"string","format":"date-time","nullable":true},"_visibility":{"type":"string","enum":["public","protected","private"]},"_version":{"type":"number"},"_lastUpdatedBy":{"type":"string"},"_createdBy":{"type":"string"},"_ownerUsers":{"type":"array","items":{"type":"string"}},"_ownerGroups":{"type":"array","items":{"type":"string"}},"_viewerUsers":{"type":"array","items":{"type":"string"}},"_viewerGroups":{"type":"array","items":{"type":"string"}}},"required":[]}'

  metricsEndpointsMap:
    "true": gateway,health,metrics
    "false": ""
---
debug: ${app.debug}
server:
  port: ${app.inbound.port}
  address: ${app.inbound.address}
  compression:
    enabled: true
    mime-types: application/json
  
  # CRITICAL: Graceful shutdown ensures in-flight requests are completed before killing the pod
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # CRITICAL: Configures the shared ObjectMapper bean used in our filters
  jackson:
    serialization:
      write-dates-as-timestamps: false # Forces ISO-8601 date format (e.g., "2023-12-01T10:00:00Z")

  # CRITICAL: Increases the buffer size for request bodies. 
  # Since ValidateEntityRequestBody reads the whole body, we need more than the default 256KB.
  codec:
    max-in-memory-size: 10MB 

  config:
    import:
      - classpath:application-auth.yml
      - classpath:app-inbound.yml
      - classpath:app-outbound.yml
      - classpath:application-cors.yml
      - classpath:application-timeouts.yml
      - classpath:application-routes.yml
      - classpath:application-route-toggles.yml
      - classpath:application-logging.yml
      - classpath:application-fieldsets.yml
      - classpath:application-queries.yml
      - classpath:application-request-sizes.yml
      - classpath:application-rate-limits.yml
      - classpath:application-locks.yml
      - classpath:application-local-caching.yml
  application:
    name: ${app.name}
  
  data:
    redis:
      host: ${app.outbound.redis.host}
      port: ${app.outbound.redis.port}
      database: ${app.outbound.redis.database}
      password: ${app.outbound.redis.password} #Override this field with a value from Kubernetes secret. See .README.
      
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${app.outbound.backend.connectTimeoutMs}
        response-timeout: ${app.outbound.backend.responseTimeout}
        pool:
          type: fixed
          max-connections: ${app.outbound.backend.maxConnections}
          acquire-timeout: ${app.outbound.backend.acquireTimeoutMs}
          # Recommended setting to prevent stale connection issues in cloud environments
          max-life-time: 45000 
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${app.inbound.cors.allowedOrigins}
            allowedMethods: ${app.inbound.cors.allowedMethods}
            allowedHeaders: ${app.inbound.cors.allowedHeaders}
            exposedHeaders: ${app.inbound.cors.exposedHeaders}
            allowCredentials: ${app.inbound.cors.allowCredentials}
            maxAge: ${app.inbound.cors.maxAge}
      metrics:
        enabled: ${app.inbound.metricsEnabled}
      filter:
        local-response-cache:
          enabled: false # we use our custom local cache filter implementation
  
  jmx:
    enabled: ${app.jmx}
    default-domain: ${app.shortcode}