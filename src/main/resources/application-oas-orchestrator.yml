# ============================================================
# Dynamic OAS Orchestrator Configuration
# ============================================================
# This file contains all configuration options for the
# Dynamic OAS Orchestrator feature. Include this file
# in your application configuration to enable the feature.
#
# Usage in application.yml:
#   spring:
#     config:
#       import:
#         - classpath:application-oas-orchestrator.yml
# ============================================================

# Main toggle - set to true to enable the OAS Orchestrator
app:
  oas:
    orchestrator:
      enabled: true
      
      # --------------------------------------------------------
      # Endpoint Configuration
      # --------------------------------------------------------
      endpoints:
        # Path for JSON-formatted OpenAPI spec
        json: /openapi.json
        
        # Path for YAML-formatted OpenAPI spec
        yaml: /openapi.yaml
        
        # NOTE: Authentication requirement is controlled by app.auth.providers
        # If providers are configured (via application-auth.yml or dev.properties),
        # JWT is required. No separate OAS-specific toggle needed.
      
      # --------------------------------------------------------
      # Backend Service Configuration
      # --------------------------------------------------------
      backend:
        # Path to backend's OAS endpoint (appended to routing-target URL)
        spec-path: /explorer/openapi.json
        
        # Connection timeout in milliseconds
        connect-timeout-ms: 10000
        
        # Read timeout in milliseconds
        read-timeout-ms: 10000
        
        # Application Startup Retry Logic
        # We must fetch the backend schema at startup. If it fails, we retry.
        retry:
          max-attempts: 5
          initial-interval-ms: 2000
          multiplier: 1.5
          max-interval-ms: 10000

      # --------------------------------------------------------
      # Cache Configuration
      # --------------------------------------------------------
      cache:
        # Enable caching
        enabled: true
        
        # Time-to-live for cached OAS specs
        ttl: 15m
        
        # TTL for raw backend OAS cache
        raw-oas-ttl: 5m
        
        # Maximum entries in L1 (Caffeine) cache
        max-local-cache-size: 100
        
        # Redis key prefix
        key-prefix: "oas:v1:"
      
      # --------------------------------------------------------
      # OPA Configuration
      # --------------------------------------------------------
      opa:
        # OPA policy path for field permissions
        # Uses the SAME policy as FetchForbiddenFieldsGatewayFilterFactory
        # This ensures consistent field visibility between gateway routes and OpenAPI docs
        field-policy: /policies/gateway/forbidden_fields/policy/result
        
        # Timeout for OPA queries
        timeout: 500ms
        
        # Fail-closed mode (if true, OPA failure = 503)
        fail-closed: true
      
      # --------------------------------------------------------
      # Transformation Configuration
      # --------------------------------------------------------
      transformation:
        # Include generic (non-aliased) endpoints
        include-generic-endpoints: false
        
        # Simplify verbose schema names
        simplify-schema-names: true

# ============================================================
# To test the endpoint:
#   curl -H "Authorization: Bearer <token>" http://localhost:8080/openapi.json
# ============================================================
