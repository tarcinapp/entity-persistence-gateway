            controllerName: entities
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerBasePaths.entities}, ${app.outbound.routing-target.baseUri}entities
        - AuthenticateRequest
        - GenerateRequestId
        - name: RequestRateLimiter
