        - FetchForbiddenFields
        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/entities/updateAllEntities/policy
        - PreventStringifiedJsonFilter
        - ConvertSimplerQueriesToBackendFormat
        - AddSetsToEntityListOrReactionViaRecordQuery
        - PreventQueryByForbiddenFields
        - RemoveRequestHeader=Authorization
        metadata:
          recordType: entities
          controllerName: entities
          connect-timeout: ${app.timeouts.entities.updateAllEntities.connectTimeoutMs}
          response-timeout: ${app.timeouts.entities.updateAllEntities.responseTimeoutMs}
          tags:
          - patch
          - update
          - update-all
          - bulk
          - write
          - manage
          - entities
          - generic
