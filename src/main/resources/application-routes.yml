spring:
  cloud:
    gateway:
      routes:
      # entity controller
      - id: createEntity
        uri: ${app.backend.protocol}://${app.backend.host}:${app.backend.port}
        predicates:
        - Path=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}
        - Method=POST
        filters:
        - name: RequestSize
          args:
            maxSize: ${app.requestSizes.entities.create}
        - name: CheckIfRouteEnabled
        - RewritePath=${app.inbound.baseUri}${app.inbound.controllerPaths.entities}, ${app.backend.baseUri}entities
        - name: AuthenticateRequestRefactored
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: ${app.rate-limits.entities.replenishRate}
              burstCapacity: ${app.rate-limits.entities.burstCapacity}
        - name: AuthorizeRequest
          args:
            policyName: /policies/auth/routes/entities/createEntity/policy
        - name: AcquireLockForCreation
          args:
            waitTime: ${app.locks.entities.create.waitTime}
            leaseTime: ${app.locks.entities.create.leaseTime}
        - name: AddManagedFieldsInCreation
        - name: ApplyFieldsetConfig
          args:
            recordType: entities
        - RemoveRequestHeader=Authorization
        - name: DropFieldsForSingleItemResponses
          args:
            policyName: /policies/fields/entities/policy
      - id: updateAllEntities
        uri: ${app.backend.protocol}://${app.backend.host}:${app.backend.port}
