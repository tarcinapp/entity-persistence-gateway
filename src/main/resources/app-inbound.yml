app:
  inbound:
    address: 0.0.0.0
    port: 8081
    baseUri: /api/v1/
    
    # To disable metrics, set metricsEnabled: false AND exposedEndpoints: "none"
    metricsEnabled: true
    exposedEndpoints: "gateway,health,metrics,prometheus,jolokia,env,info"
    
    # Base paths used by routing logic (controllerBasePaths)
    controllerBasePaths:
      entities: entities
      lists: lists
      entitiesThroughList: ${app.inbound.controllerBasePaths.entities}
      listsThroughEntity: ${app.inbound.controllerBasePaths.lists}
      relations: relations
      explorer: explorer
      entityReactions: entity-reactions
      listReactions: list-reactions
      reactionsThroughEntity: reactions
      reactionsThroughList: reactions
      # Accessor segments for hierarchical routes
      defaultChildrenAccessor: children
      defaultParentsAccessor: parents
      # Per-record-type accessors (override if needed)
      entitiesChildrenAccessor: ${app.inbound.controllerBasePaths.defaultChildrenAccessor}
      entitiesParentsAccessor: ${app.inbound.controllerBasePaths.defaultParentsAccessor}
      listsChildrenAccessor: ${app.inbound.controllerBasePaths.defaultChildrenAccessor}
      listsParentsAccessor: ${app.inbound.controllerBasePaths.defaultParentsAccessor}
      entityReactionsChildrenAccessor: ${app.inbound.controllerBasePaths.defaultChildrenAccessor}
      entityReactionsParentsAccessor: ${app.inbound.controllerBasePaths.defaultParentsAccessor}
      listReactionsChildrenAccessor: ${app.inbound.controllerBasePaths.defaultChildrenAccessor}
      listReactionsParentsAccessor: ${app.inbound.controllerBasePaths.defaultParentsAccessor}
      
    cors:
      allowedOrigins: "http://localhost:8080"
      allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
      allowedHeaders: "Accept,Accept-Language,Authorization,Cache-Control,Connection,Content-Type,Host,Origin,Pragma,Referer,User-Agent,If-Match,If-None-Match,If-Modified-Since,If-Unmodified-Since,X-Requested-With,X-XSRF-TOKEN,X-Geolocation,${app.requestId}"
      exposedHeaders: "Date,Content-Type,Content-Length,Content-Disposition,Location,ETag,Link,X-Total-Count,X-Page-Count,Retry-After,X-Cache-Status,${app.requestId}"
      allowCredentials: true
      maxAge: 3600