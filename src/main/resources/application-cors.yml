app:
  inbound:
    cors:
      allowedOrigins: 
      - "http://localhost:8080"
      # Don't forget to add production domains here
      # - "https://api.myapp.com" 
      
      allowedMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS" # MANDATORY for Pre-flight requests
      - "HEAD"    # Useful for resource existence/size checks without downloading body
      
      allowedHeaders:
      - "Accept"
      - "Accept-Language"   # For i18n (internationalization) support
      - "Authorization"
      - "Cache-Control"
      - "Connection"
      - "Content-Type"
      - "Host"
      - "Origin"
      - "Pragma"
      - "Referer"
      - "User-Agent"
      - "If-Match"          # CRITICAL for ETag / Optimistic Locking logic
      - "If-None-Match"     # CRITICAL for Caching (handling 304 Not Modified)
      - "If-Modified-Since" # For Caching strategies
      - "If-Unmodified-Since"
      - "X-Requested-With"
      - "X-XSRF-TOKEN"      # Standard header for CSRF protection
      - "X-Geolocation"
      - ${app.requestId}    # Custom Request ID for tracing
      
      exposedHeaders:
      # Headers that are explicitly allowed to be read by the Browser's JS code:
      - "Date"
      - "Content-Type"
      - "Content-Length"
      - "Content-Disposition" # Required to read filenames during file downloads
      - "Location"            # Returns the URL of the new resource in 201 Created responses
      - "ETag"                # CRITICAL for the frontend to read the entity version
      - "Link"                # Standard for Pagination (Next/Prev page links)
      - "X-Total-Count"       # Pagination: Total number of records
      - "X-Page-Count"        # Pagination: Total number of pages
      - "Retry-After"         # Rate Limiting: Tells the client how long to wait
      - "X-Cache-Status"      # Gateway Cache Status (HIT/MISS) for debugging
      - ${app.requestId}      # Trace ID for error tracking
      
      allowCredentials: true
      maxAge: 3600 # Cache the Pre-flight response for 1 hour to reduce network traffic